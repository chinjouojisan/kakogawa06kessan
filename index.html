/* 出題数：初級3問／中級5問／上級7問。難易度未選択時は5問。 */
const QUIZ_COUNT_BY_LEVEL = { beginner: 3, intermediate: 5, advanced: 7 };

function shuffled(a) {
  const arr = a.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* 選択肢の並びも毎回入れ替える。正解の位置を覚えられないようにするためで、
   同じ問題が再び出たときの手応えも変わる。 */
function pickQuiz(n, seen) {
  const fresh = QUIZ_POOL.filter((q) => !seen.includes(q.id));
  const pool = fresh.length >= n ? fresh : QUIZ_POOL;
  return shuffled(pool)
    .slice(0, n)
    .map((q) => {
      const order = shuffled([0, 1, 2]);
      return {
        ...q,
        choices: order.map((i) => q.choices[i]),
        answer: order.indexOf(q.answer),
      };
    });
}

// カテゴリ内の全項目（items）を配列としてまとめたヘルパー

/* ============================================================
   事業の「注目フラグ」
   AIの判定ではなく、資料に書かれている事実だけから導く。
   selfReview : 事務事業評価シートの「今後の方向」が 改善／縮小／廃止／統合
   questioned : 会議録で「届いていない・ずれている・効果未確認・目標の疑問」が出た事業
   ============================================================ */
const SELF_REVIEW_DIRECTIONS = ["改善", "縮小", "廃止", "統合"];
const QUESTIONED_TYPES = ["unused", "misfit", "unmeasured", "target"];

const PROJECT_BY_NAME = new Map(
  Object.values(PROJECT_POOL)
    .flat()
    .map((p) => [p.name, p])
);

function projectFlags(projectName) {
  const project = PROJECT_BY_NAME.get(projectName);
  const entries = GIKAI_POOL[projectName] || [];
  return {
    selfReview: !!project && SELF_REVIEW_DIRECTIONS.includes(project.direction),
    questioned: entries.some((e) => QUESTIONED_TYPES.includes(e.type)),
  };
}

function FlagBadges({ projectName, showSource }) {
  const f = projectFlags(projectName);
  if (!f.selfReview && !f.questioned) return null;
  const badges = [];
  if (f.selfReview)
    badges.push({ text: "市が見直すと明記", color: "#1B7FA8", src: "事務事業評価シート" });
  if (f.questioned)
    badges.push({ text: "議会で問われた", color: "#3E7CA6", src: "委員会会議録" });
  return (
    <div className="mt-1">
      {badges.map((b, i) => (
        <span
          key={i}
          className="inline-block mr-1 font-mono text-[9px] px-1.5 py-0.5 rounded-sm"
          style={{ background: b.color, color: "#FFFFFF" }}
        >
          {b.text}
        </span>
      ))}
      {showSource && (
        <p className="font-mono text-[9px] mt-1" style={{ color: "#767676" }}>
          出典：{badges.map((b) => b.src).join(" ／ ")}
        </p>
      )}
    </div>
  );
}

/* 難易度に応じて、STEP3 で見せる事業を絞る。
   「動かせる金額（flexible の合計）」が大きい順に、費目ごとの割合で選ぶ。
   ここで開ける事業の可動額が、そのまま削減の上限になる。
   選び方は固定で、遊ぶたびに変わることはない。 */
const flexTotalOf = (p) =>
  p.items.reduce((a, it) => a + (it.locked ? 0 : it.costOku), 0);

const VISIBLE_PROJECTS = Object.fromEntries(
  DIFFICULTY_LEVELS.map((d) => [
    d.id,
    Object.fromEntries(
      Object.entries(PROJECT_POOL).map(([catId, ps]) => {
        // 入門など、特定の事業名だけを指定する難易度はここで確定させ、
        // 通常の「動かせる金額が大きい順」ロジックは通さない。
        if (d.explicitProjects) {
          const keep = new Set(d.explicitProjects);
          return [catId, ps.filter((p) => keep.has(p.name))];
        }
        const sorted = [...ps].sort(
          (a, b) => flexTotalOf(b) - flexTotalOf(a) || a.name.localeCompare(b.name)
        );
        // projectCategories を指定した難易度では、そこは割合どおり、
        // それ以外の費目も「動かせる金額がいちばん大きい1件」だけは必ず開けるようにする。
        const isOther = d.projectCategories && !d.projectCategories.includes(catId);
        // 代表として出す費目では、大きすぎる事業を避ける。
        // 1件を全部止めれば目標に届く、という遊び方を生まないため。
        const source =
          isOther && d.projectOthersMaxOku
            ? (() => {
                const small = sorted.filter((p) => flexTotalOf(p) <= d.projectOthersMaxOku);
                return small.length >= (d.projectOthers || 1) ? small : sorted;
              })()
            : sorted;
        const n = isOther
          ? Math.min(d.projectOthers || 1, source.length)
          : Math.max(1, Math.ceil(source.length * d.projectRatio));
        const keep = new Set(source.slice(0, n).map((p) => p.name));
        return [catId, ps.filter((p) => keep.has(p.name))];
      })
    ),
  ])
);

function visibleProjects(catId, difficultyId) {
  const byLevel = VISIBLE_PROJECTS[difficultyId] || VISIBLE_PROJECTS.advanced;
  return byLevel[catId] || [];
}

/* 削減率を入れた項目を取り出す。STEP4（理由づけ）と STEP7（答え合わせ）で共有する。 */
function collectChosenItems(itemPercents) {
  return Object.entries(itemPercents || {}).flatMap(([catId, map]) =>
    Object.keys(map)
      .filter((key) => map[key] > 0)
      .map((key) => {
        const [projectName, itemLabel] = key.split("__");
        const project = (PROJECT_POOL[catId] || []).find((x) => x.name === projectName);
        const item = project && project.items.find((it) => it.label === itemLabel);
        return project && item
          ? {
              key: `${catId}__${key}`,
              projectName,
              itemLabel,
              direction: project.direction,
              percent: map[key],
              cutOku: item.costOku * (map[key] / 100),
              consequence: item.consequence,
            }
          : null;
      })
      .filter(Boolean)
  );
}

/* 削った理由の選択肢。4つ目は「正直、よく分からなかった」を残しておく。 */
const CUT_REASONS = [
  { id: "unmeasured", label: "効果が確かめられていないと思った" },
  { id: "replaceable", label: "ほかで代えがきくと思った" },
  { id: "endure", label: "必要だが、今は我慢してもらう" },
  { id: "unknown", label: "正直、よく分からないまま削った" },
];

/* 一律削減かどうかの判定。
   費目ごとに「動かせる枠のうち何割を削ったか」を出し、
   5費目以上に手をつけていて、その割合がほぼ揃っているときを一律とみなす。 */
function isFlatCut(checklistCutByCategory) {
  const rates = CATEGORIES.map((c) => {
    const flex = (PROJECT_POOL[c.id] || []).reduce(
      (a, p) => a + p.items.reduce((b, it) => b + (it.locked ? 0 : it.costOku), 0),
      0
    );
    if (flex <= 0) return null;
    return (checklistCutByCategory[c.id] || 0) / flex;
  }).filter((r) => r !== null && r > 0.02);
  if (rates.length < 5) return false;
  return Math.max(...rates) - Math.min(...rates) <= 0.15;
}

const flattenItems = (categoryId) =>
  (PROJECT_POOL[categoryId] || []).flatMap((p) =>
    p.items.map((it) => ({ ...it, projectName: p.name }))
  );

function oku(n) {
  return n.toLocaleString("ja-JP", { maximumFractionDigits: 2 });
}

/* 金額の表示。1億円以上は「◯.◯◯億円」、それ未満は「◯,◯◯◯万円」。
   事業の中身は1億円未満がほとんどで、億で丸めると「0億」になってしまうため。 */
function yen(oku_) {
  const n = Number(oku_) || 0;
  if (Math.abs(n) >= 1) return `${n.toLocaleString("ja-JP", { maximumFractionDigits: 2 })}億円`;
  const man = Math.round(n * 10000);
  if (Math.abs(man) >= 1) return `${man.toLocaleString("ja-JP")}万円`;
  return `${Math.round(n * 100000000).toLocaleString("ja-JP")}円`;
}

function Hanko({ label, show }) {

      className={`pointer-events-none absolute -right-2 -top-3 h-16 w-16 rounded-full border-[3px] flex items-center justify-center

        ${show ? "opacity-90 scale-100 rotate-[-8deg]" : "opacity-0 scale-150 rotate-[-8deg]"}`}
      style={{ borderColor: "#C0392B", color: "#C0392B" }}
    >
      {label}
    </div>
  );
}

// 項目ごとの削減率の通常上限。「この事業は不要」判定のときだけ、
// 呼び出し側でこれを超えるcap（100）を渡して全額まで動かせるようにする。
const MAX_ITEM_PERCENT_DEFAULT = 50;

function BudgetGame() {
  const [step, setStep] = useState(0);
  // ページ（STEP）が変わったら、必ず画面の先頭に戻す
  useEffect(() => {
    window.scrollTo(0, 0);
    if (document.documentElement) document.documentElement.scrollTop = 0;
    if (document.body) document.body.scrollTop = 0;
  }, [step]);
  const [quizStarted, setQuizStarted] = useState(false);
  const [difficultyId, setDifficultyId] = useState(DEFAULT_DIFFICULTY_ID);
  const difficulty =
    DIFFICULTY_LEVELS.find((d) => d.id === difficultyId) || DIFFICULTY_LEVELS[1];
  const goalOku = difficulty.goalOku;
  const [confirmedIds, setConfirmedIds] = useState({});
  // 事業ごとの見直し判定：{ [事業名]: "review" | "ok" | "hold" }
  const [judgments, setJudgments] = useState({});
  const setJudgment = (name, verdict) =>
    setJudgments((prev) => {
      const nextVerdict = prev[name] === verdict ? undefined : verdict;
      // 「不要」判定を外れたら、その事業のスライダーが通常上限(50%)を
      // 超えたまま残らないよう、超過分だけ50%に切り下げる。
      if (prev[name] === "unnecessary" && nextVerdict !== "unnecessary") {
        setItemPercents((prevPercents) => {
          const next = { ...prevPercents };
          for (const catId of Object.keys(PROJECT_POOL)) {
            const map = next[catId];
            if (!map) continue;
            let changed = false;
            const newMap = { ...map };
            for (const key of Object.keys(newMap)) {
              if (key.startsWith(`${name}__`) && newMap[key] > MAX_ITEM_PERCENT_DEFAULT) {
                newMap[key] = MAX_ITEM_PERCENT_DEFAULT;
                changed = true;
              }
            }
            if (changed) next[catId] = newMap;
          }
          return next;
        });
      }
      return { ...prev, [name]: nextVerdict };
    });
  // 削った理由：{ "カテゴリ__事業名__項目名": 理由id }
  const [reasons, setReasons] = useState({});
  const setReason = (key, reasonId) =>
    setReasons((prev) => ({ ...prev, [key]: prev[key] === reasonId ? undefined : reasonId }));
  // 項目ごとの削減率(0〜30%)を記録：{ [categoryId]: { "事業名__項目名": percent } }
  const [itemPercents, setItemPercents] = useState({});
  const [step6Picks] = useState(() => {
    const shuffled = [...KESSAN_POOL].sort(() => Math.random() - 0.5);
    return shuffled.slice(0, 2);
  });

  // カテゴリごとの「事業の中身を削った分」の削減額
  const checklistCutByCategory = useMemo(() => {
    const result = {};
    for (const catId of Object.keys(PROJECT_POOL)) {
      const percentMap = itemPercents[catId] || {};
      result[catId] = flattenItems(catId).reduce((acc, it) => {
        const key = `${it.projectName}__${it.label}`;
        const pct = it.locked ? 0 : percentMap[key] || 0;
        return acc + it.costOku * (pct / 100);
      }, 0);
    }
    return result;
  }, [itemPercents]);

  // 削減合計 ＝ 事業の中身を削った分だけ（費目単位のスライダーは廃止した）
  const totalCut = useMemo(
    () => Object.values(checklistCutByCategory).reduce((a, b) => a + b, 0),
    [checklistCutByCategory]
  );

  // 「わかった上で削る」を押したとき、その費目に決定のハンコを一瞬出す
  const markConfirmed = (id) => {
    setConfirmedIds((prev) => ({ ...prev, [id]: true }));
    window.clearTimeout(window.__hankoTimer);
    window.__hankoTimer = window.setTimeout(() => {
      setConfirmedIds((prev) => ({ ...prev, [id]: false }));
    }, 900);
  };

  // 項目単位の削減率(0〜30%)を設定。locked（動かせない項目）は何もしない。
  const setItemPercent = (categoryId, projectName, itemLabel, percent, locked, maxPercent) => {
    if (locked) return;
    const cap = maxPercent || MAX_ITEM_PERCENT_DEFAULT;
    const clamped = Math.max(0, Math.min(cap, percent));
    const key = `${projectName}__${itemLabel}`;
    setItemPercents((prev) => ({
      ...prev,
      [categoryId]: { ...(prev[categoryId] || {}), [key]: clamped },
    }));
  };

/* 「説明できる削減」の集計。
   点数でも正解でもなく、自分が何を根拠に削ったかを映す鏡として使う。
   根拠は2種類。
   ・資料：市が見直すと書いた事業か、議会で問われた事業か
   ・自分：STEP4で理由を選んだか（「よく分からないまま」は含めない） */
function explainability(itemPercents, reasons) {
  const items = collectChosenItems(itemPercents);
  const detail = items.map((it) => {
    const f = projectFlags(it.projectName);
    const r = reasons ? reasons[it.key] : undefined;
    const bySource = f.questioned || f.selfReview;
    const bySelf = !!r && r !== "unknown";
    return { ...it, bySource, bySelf, explained: bySource || bySelf };
  });
  const explained = detail.filter((d) => d.explained);
  return {
    total: detail.length,
    explained: explained.length,
    okuTotal: detail.reduce((a, d) => a + d.cutOku, 0),
    okuExplained: explained.reduce((a, d) => a + d.cutOku, 0),
    detail,
  };
}

/* STEP3のあいだ画面下に出しつづける進捗。
   金額だけを大きく出すと「積むゲーム」に見えてしまうので、
   選んだ項目数と並べて、数字を2つにしている。 */
function ProgressBar({ totalCut, goalOku, itemCount }) {
  const rate = Math.min(100, Math.round((totalCut / goalOku) * 100));
  const achieved = totalCut >= goalOku;
  return (
    <div
      className="fixed bottom-0 left-0 right-0 z-40"
      style={{ background: "#123B6B", boxShadow: "0 -2px 10px rgba(18,59,107,0.3)" }}
    >

        <div className="flex items-baseline justify-between gap-3">
          <div className="flex items-baseline gap-2 min-w-0">
            <span className="font-mono text-[15px] font-bold" style={{ color: achieved ? "#8FE0B0" : "#FFFFFF" }}>
              {yen(totalCut)}
            </span>
            <span className="font-body text-[11px]" style={{ color: "#AEC4DA" }}>
              / 目標 {yen(goalOku)}
            </span>
          </div>
          <span className="font-body text-[11px] shrink-0" style={{ color: "#AEC4DA" }}>
            選んだ項目 <span className="font-mono text-[13px]" style={{ color: "#FFFFFF" }}>{itemCount}</span>
          </span>
        </div>
        <div className="h-1 mt-1.5 rounded-sm overflow-hidden" style={{ background: "#2C5A80" }}>
          <div
            style={{
              width: `${rate}%`,
              height: "100%",
              background: achieved ? "#8FE0B0" : "#7FB2CE",
              transition: "width 0.2s",
            }}
          />
        </div>
      </div>
    </div>
  );
}

/* その費目で、実際に開けた事業のうちどれだけ削ったかの割合（0〜1）。
   分母は「開けた事業の可動額 × 上限50%」。触れなかった費目は null を返し、
   評価の対象から外す（公債費や議会費は事業が無いため）。 */
function cutRatioOf(catId, difficultyId, checklistCutByCategory) {
  const ps = visibleProjects(catId, difficultyId);
  const flex = ps.reduce(
    (a, p) => a + p.items.reduce((b, it) => b + (it.locked ? 0 : it.costOku), 0),
    0
  );
  if (flex <= 0) return null;
  const max = flex * 0.5;
  return Math.min(1, (checklistCutByCategory[catId] || 0) / max);
}

/* ---------------- STEP3：削る ---------------- */
/* 判定の選択肢。「不要」は事業そのものの継続を問う最も強い判定なので、
   完了済み事業（direction === "完了"）には出さない。完了事業は
   「終了・振り返り」という別枠の情報表示に置き換える（下記 CompletedNotice）。 */
const JUDGE_OPTIONS = [
  { id: "ok", label: "妥当だと思う", sub: "来年も続けてよい", color: "#1B7A4B", bg: "#E8F5EE", bd: "#1B7A4B" },
  { id: "review", label: "見直す余地あり", sub: "次の予算へ申し送り", color: "#C0392B", bg: "#FBEAE8", bd: "#C0392B" },
  { id: "unnecessary", label: "この事業は不要", sub: "廃止を検討すべき", color: "#7A1F14", bg: "#F3D9D4", bd: "#7A1F14" },
  { id: "hold", label: "判断できない", sub: "情報が足りない", color: "#555555", bg: "#EEF0F2", bd: "#9AA0A6" },
];

function CompletedNotice() {
  return (
    <div
      className="mt-2 rounded-sm px-2.5 py-2"
      style={{ background: "#F3F4F6", border: "1px dashed #9AA0A6" }}
      onClick={(e) => e.stopPropagation()}
    >
      <p className="font-body text-[11px] font-medium" style={{ color: "#444444" }}>
        この事業はすでに完了しています
      </p>
      <p className="font-body text-[11px] mt-1 leading-relaxed" style={{ color: "#555555" }}>
        　使ったお金を今から削ることはできません。ここで問えるのは「削れたか」ではなく、
        「その規模・進め方は妥当だったか」という振り返りです。次の同種の事業に活かせる
        気づきがあれば、それが決算を見る意味になります。
      </p>
    </div>
  );
}

function JudgePanel({ projectName, direction, hasCuttableItems, judgments, setJudgment }) {
  const cur = judgments[projectName];
  const isCompleted = direction === "完了";

  if (isCompleted) {
    return <CompletedNotice />;
  }

  // 「不要」は事業を廃止できることが前提の判定。動かせる項目が
  // 1つもない事業（全額が法定経費・国県補助・契約済みで固定）は、
  // そもそも市の判断で削れないので選べないようにする。
  const options = hasCuttableItems
    ? JUDGE_OPTIONS
    : JUDGE_OPTIONS.filter((o) => o.id !== "unnecessary");

  return (
    <div className="mt-2" onClick={(e) => e.stopPropagation()}>
      <p className="font-body text-[11px] mb-1" style={{ color: "#444444" }}>
        あなたの判定は？（決算を審査する市民委員として）
      </p>
      {!hasCuttableItems && (
        <p className="font-body text-[10px] mb-1.5 leading-relaxed" style={{ color: "#767676" }}>
          　この事業は全額が法定経費・国や県の基準・契約等で固定されており、
          市の判断で動かせる部分がありません。そのため「不要」は選べません。
        </p>
      )}
      <div className="grid grid-cols-2 gap-1.5">
        {options.map((o) => {
          const on = cur === o.id;
          return (
            <button
              key={o.id}
              type="button"
              onClick={() => setJudgment(projectName, o.id)}
              className="rounded-md px-1.5 py-1.5 text-center transition"
              style={{
                background: on ? o.bg : "#FFFFFF",
                border: on ? ("1.5px solid " + o.bd) : "1px solid #E2E5E9",
              }}
            >
              <div className="font-body text-[11px] font-medium" style={{ color: on ? o.color : "#1A1A1A" }}>
                {o.label}
              </div>
              <div className="font-body text-[9px] mt-0.5" style={{ color: "#767676" }}>
                {o.sub}
              </div>
            </button>
          );
        })}
      </div>
    </div>
  );
}

function Step3({
  markConfirmed,
  confirmedIds,
  judgments,
  setJudgment,
  totalCut,
  goalOku,
  difficulty,
  itemPercents,
  setItemPercent,
  checklistCutByCategory,
  onNext,
}) {
  const [openProjects, setOpenProjects] = useState({});
  const [expandedProject, setExpandedProject] = useState({});
  const [lockedOpen, setLockedOpen] = useState({});
  const [confirmKey, setConfirmKey] = useState(null);
  const [acknowledged, setAcknowledged] = useState({});
  const [nudge, setNudge] = useState(null);
  const [nudgeSeen, setNudgeSeen] = useState([]);
  const [nudgeMuted, setNudgeMuted] = useState(false);
  const [actionCount, setActionCount] = useState(0);
  const [lastNudgeAt, setLastNudgeAt] = useState(-99);
  const [idle, setIdle] = useState(false);

  const shownProjects = (catId) => visibleProjects(catId, difficulty.id);
  const shownTotal = CATEGORIES.reduce((a, c) => a + shownProjects(c.id).length, 0);

  // 操作があるたびに1つ数え、しばらく動きがなければ idle にする
  useEffect(() => {
    setActionCount((n) => n + 1);
    setIdle(false);
    const t = window.setTimeout(() => setIdle(true), NUDGE_IDLE_MS);
    return () => window.clearTimeout(t);
  }, [itemPercents, openProjects, expandedProject]);

  // 条件に合うひとことを1つだけ選ぶ
  useEffect(() => {
    if (nudgeMuted || nudge) return;
    if (nudgeSeen.length >= NUDGE_MAX) return;
    if (actionCount - lastNudgeAt < NUDGE_COOLDOWN) return;
    const ctx = {
      checklistCutByCategory,
      itemPercents,
      openedCount: Object.values(openProjects).filter(Boolean).length,
      idle,
    };
    const hit = NUDGE_RULES.find((r) => !nudgeSeen.includes(r.id) && r.test(ctx));
    if (hit) {
      setNudge({ id: hit.id, text: hit.text(ctx), pose: hit.pose });
      setNudgeSeen((s) => [...s, hit.id]);
      setLastNudgeAt(actionCount);
    }
  }, [actionCount, idle, nudge, nudgeMuted]);

  return (
    <Card>
      <p className="font-body text-xs" style={{ color: "#1B5FA8" }}>STEP 3</p>

　あなたは、決算を審査する市民委員です。使い終わったお金を一件ずつ見て、「来年も同じでよいか」を判定してください。事業を開くと、カコモの見方と、あなたの判定ボタンが出ます。削るのではなく、次の予算への申し送りです。「見直す余地あり」と判定した事業では、もし手を入れるならどれくらい動かせるか、任意で試すこともできます。

        無駄だった証拠ではありません。他市比較や相場との照合はしていません。
      </p>
      <NudgeBox
        nudge={nudge}
        onDismiss={() => setNudge(null)}
        onMute={() => {
          setNudge(null);
          setNudgeMuted(true);
        }}
      />

      {shownTotal < 196 && (
        <p className="font-body text-[11px] mb-4" style={{ color: "#767676" }}>
          {difficulty.explicitProjects ? (
            "※ 入門では、身近な3事業だけを見ます。決算全体（196件）を見たくなったら、初級以上に進んでください。事業の出典は加古川市「事務事業評価シート＜令和６年度実施事業＞」です。"
          ) : (
            <>
              ※ {difficulty.label}では、動かせる金額の大きい{shownTotal}件だけを開けます（全196件）。
              {difficulty.projectCategories
                ? `${difficulty.projectCategories
                    .map((id) => (CATEGORIES.find((c) => c.id === id) || {}).name)
                    .filter(Boolean)
                    .join("・")}は全部、ほかの費目は代表${difficulty.projectOthers || 1}件ずつです。`

                                      </div>

                                      {!it.locked && <FlagBadges projectName={p.name} showSource />}

                                      <p className="font-body text-[10px] mt-1" style={{ color: "#555555" }}>
                                        {it.locked ? "動かせない：" : "この項目は："}
                                        {it.note}
                                      </p>
                                      {!it.locked && (
                                        <div className="mt-2">
                                          <input
                                            type="range"
                                            min={0}
                                            max={judgments[p.name] === "unnecessary" ? 100 : MAX_ITEM_PERCENT_DEFAULT}
                                            step={1}
                                            value={pct}
                                            onChange={(e) => {
                                              const v = Number(e.target.value);
                                              const cap = judgments[p.name] === "unnecessary" ? 100 : MAX_ITEM_PERCENT_DEFAULT;
                                              setItemPercent(c.id, p.name, it.label, v, false, cap);
                                              if (v > 0 && !acknowledged[itemKey]) setConfirmKey(itemKey);
                                              if (v === 0) setConfirmKey(null);
                                            }}
                                            className="w-full accent-[#C0392B]"
                                          />
                                          <div className="flex justify-between font-mono text-[10px]" style={{ color: "#767676" }}>
                                            <span>{pct}% 削減（{yen(itemCut)}）</span>
                                            <span>上限 {judgments[p.name] === "unnecessary" ? 100 : MAX_ITEM_PERCENT_DEFAULT}%</span>
                                          </div>

                                          {confirmKey === itemKey && (
                                            <div
                                              className="mt-2 rounded-sm px-2.5 py-2"
                                              style={{ background: "#F7F9FB", border: "2px solid #C0392B" }}
                                            >
                                              <p className="font-display text-[13px]" style={{ color: "#992D22" }}>
                                                これで困るのは、誰でしょう。
                                              </p>
                                              <p className="font-body text-[11px] mt-1 leading-relaxed" style={{ color: "#1A1A1A" }}>
                                                {it.consequence
                                                  ? it.consequence
                                                  : `${p.name}の「${it.label}」を減らすことになります。`}
                                              </p>
                                              {p.note && (
                                                <p
                                                  className="font-body text-[11px] mt-1.5 rounded-sm px-2 py-1.5"
                                                  style={{ background: "#FFFFFF", color: "#444444" }}
                                                >
                                                  この事業がいま届いている先：{p.note}
                                                </p>
                                              )}
                                              {projectFlags(p.name).questioned && (
                                                <p className="font-body text-[11px] mt-1" style={{ color: "#3E7CA6" }}>
                                                  この事業は、議会でも取り上げられていました。何をどう聞いていたかは、最後に出します。
                                                </p>
                                              )}
                                              <div className="flex gap-2 mt-2">
                                                <button
                                                  onClick={() => {
                                                    setItemPercent(c.id, p.name, it.label, 0, false);
                                                    setConfirmKey(null);
                                                  }}
                                                  className="font-body flex-1 py-1.5 rounded-sm text-[12px] border"
                                                  style={{ borderColor: "#1A1A1A", color: "#1A1A1A", background: "#FFFFFF" }}
                                                >
                                                  やっぱりやめる
                                                </button>
                                                <button
                                                  onClick={() => {
                                                    setAcknowledged((prev) => ({ ...prev, [itemKey]: true }));
                                                    setConfirmKey(null);
                                                    markConfirmed(c.id);
                                                  }}
                                                  className="font-body flex-1 py-1.5 rounded-sm text-[12px]"
                                                  style={{ background: "#C0392B", color: "#FFFFFF" }}
                                                >
                                                  わかった上で削る
                                                </button>
                                              </div>
                                            </div>
                                          )}
                                        </div>
                                      )}
                                    </div>
                                  );
                                })}
                                  </div>
                                )}
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  )}

                  {checklistCut > 0 && (
                    <div className="mt-2 font-body text-[12px]" style={{ color: "#1B5FA8" }}>
                      この費目で削った合計　
                      <span className="font-mono font-bold">{yen(checklistCut)}</span>
                      <span className="font-mono" style={{ color: "#767676" }}>
                        　／ 動かせる {yen(catFlexOku)}
                      </span>
                    </div>
                  )}

                </div>
              )}
            </div>
          );
        })}
      </div>

      <div className="mt-5 rounded-sm p-3 text-center" style={{ background: "#EDEFF2" }}>
        <span className="font-body text-sm">現在の削減合計　</span>
        <span className="font-mono text-xl font-bold" style={{ color: totalCut >= goalOku ? "#1B5FA8" : "#C0392B" }}>
          {yen(totalCut)}
        </span>
        <span className="font-body text-sm"> / 目標 {yen(goalOku)}</span>
        <p className="font-body text-[11px] mt-1" style={{ color: "#767676" }}>
          削れるのは事業の中身だけです。費目をまとめて削ることはできません。
        </p>
      </div>

      <NextButton onClick={onNext}>再検討へ進む</NextButton>
    </Card>
  );
}

/* ---------------- STEP4：再検討 ---------------- */
function Step4({ totalCut, goalOku, difficulty, itemPercents, reasons, setReason, onNext, onBack }) {
  const achieved = totalCut >= goalOku;
  const chosen = collectChosenItems(itemPercents)
    .sort((a, b) => b.cutOku - a.cutOku)
    .slice(0, 5);
  const answered = chosen.filter((it) => reasons[it.key]).length;

  return (
    <Card>
      <p className="font-body text-xs" style={{ color: "#1B5FA8" }}>STEP 4</p>
      <h2 className="font-display text-xl mt-1 mb-3">
        {achieved ? "目標に到達しました" : "じゃあ、どこなら削れる？"}
      </h2>
      <p className="font-body text-[15px] leading-relaxed">
        　現在の削減額は
        <span className="font-mono font-bold" style={{ color: "#1B7FA8" }}> {yen(totalCut)}</span>
        です（{difficulty.label}／目標 {yen(goalOku)}）。
      </p>
      <p className="font-body text-sm mt-2" style={{ color: "#444444" }}>
        {achieved
          ? `${yen(goalOku)}を確保できました。ただし、その裏で何を犠牲にしたか、STEP5で振り返ります。`
          : "削れると思っていた事業の多くに、契約済みや法定経費という制約がありました。もう一度事業を見直しますか？ それとも、このまま結果を見ますか？"}
      </p>

      {chosen.length > 0 ? (
        <div className="mt-5">
          <h3 className="font-display text-[15px] mb-1">なぜ、そこを削りましたか</h3>
          <p className="font-body text-[12px] mb-3" style={{ color: "#444444" }}>
            　金額の大きかった{chosen.length}件について、理由をひとつ選んでください。
            議会も、金額そのものより「なぜ」を聞いています。
          </p>
          <div className="space-y-3">
            {chosen.map((it) => (
              <div
                key={it.key}
                className="rounded-sm px-3 py-2.5"
                style={{ background: "#FFFFFF", border: "1px solid #E2E5E9" }}
              >
                <p className="font-body text-[12px] font-medium">
                  {it.projectName}
                  <span style={{ color: "#767676" }}>　／{it.itemLabel}</span>
                </p>
                <p className="font-mono text-[10px] mb-2" style={{ color: "#767676" }}>
                  {it.percent}% を削減（{yen(it.cutOku)}）
                </p>
                <div className="space-y-1">
                  {CUT_REASONS.map((r) => {
                    const on = reasons[it.key] === r.id;
                    return (
                      <button
                        key={r.id}
                        type="button"
                        onClick={() => setReason(it.key, r.id)}
                        className="w-full text-left rounded-sm px-2 py-1.5 border transition-colors"
                        style={{
                          borderColor: on ? "#C0392B" : "#E2E5E9",
                          background: on ? "#F7E4E1" : "#FFFFFF",
                        }}
                      >
                        <span className="font-body text-[12px]">{r.label}</span>
                      </button>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
          {answered < chosen.length && (
            <p className="font-body text-[11px] mt-2" style={{ color: "#767676" }}>
              選ばずに進んでも構いません。選ばなかったことも、STEP7に出てきます。
            </p>
          )}
        </div>
      ) : (
        <div
          className="mt-5 rounded-sm px-3 py-3"
          style={{ background: "#F7ECEC", border: "1px solid #E2E5E9" }}
        >
          <p className="font-body text-[13px]" style={{ color: "#992D22" }}>
            　ここまでの削減額は{yen(totalCut)}です。
          </p>
          <p className="font-body text-[12px] mt-1" style={{ color: "#444444" }}>
　まだ1円も削っていません。STEP3に戻って事業を開き、中身を見て決めてください。
          </p>
        </div>
      )}

      <div className="flex gap-3 mt-5">
        <button
          onClick={onBack}
          className="font-body flex-1 py-3 rounded-sm text-[14px] border"
          style={{ borderColor: "#1A1A1A", color: "#1A1A1A" }}
        >
          事業に戻る
        </button>
        <button
          onClick={onNext}
          className="font-body flex-1 py-3 rounded-sm text-[14px]"
          style={{ background: "#1A1A1A", color: "#FFFFFF" }}
        >
          結果を見る
        </button>
      </div>
    </Card>
  );
}

/* ---------------- STEP5：結果発表 ---------------- */
/* 「いくら削れたか」は結果の一部に過ぎない。まず見せるべきは
   「何件をどう判定したか」という、決算を見直す本来の成果。 */
function JudgmentSummary({ judgments }) {
  // 判定を一度つけてから取り消した場合、setJudgment はキーを残したまま
  // 値を undefined にする（トグル解除の仕様）。ここで value が無い
  // エントリーまで「判定済み」に数えないよう、必ず値の有無で絞り込む。
  const entries = Object.entries(judgments).filter(([, v]) => !!v);
  const count = (id) => entries.filter(([, v]) => v === id).length;
  const okCount = count("ok");
  const reviewCount = count("review");
  const unnecessaryCount = count("unnecessary");
  const holdCount = count("hold");
  const total = entries.length;

  if (total === 0) {
    return (
      <div className="mb-4 rounded-sm px-3 py-3" style={{ background: "#FFFFFF", border: "1px solid #E2E5E9" }}>
        <p className="font-body text-[13px]" style={{ color: "#444444" }}>
          今回は、どの事業にも判定をつけませんでした。決算チャレンジの本体は「削る」ではなく、
          一件ずつ事業を見て「妥当か・見直すべきか」を判断することです。次はぜひ、
          事業を開いて判定ボタンを押してみてください。
        </p>
      </div>
    );
  }

  const rows = [
    { id: "ok", label: "妥当だと思う", n: okCount, color: "#1B7A4B" },
    { id: "review", label: "見直す余地あり", n: reviewCount, color: "#C0392B" },
    { id: "unnecessary", label: "この事業は不要", n: unnecessaryCount, color: "#7A1F14" },
    { id: "hold", label: "判断できない", n: holdCount, color: "#555555" },
  ];

  return (
    <div className="mb-4 rounded-sm px-3 py-3" style={{ background: "#FFFFFF", border: "1px solid #E2E5E9" }}>
      <div className="flex justify-between items-baseline mb-2">
        <span className="font-body text-[13px] font-medium">あなたが判定した事業</span>
        <span className="font-mono text-lg font-bold" style={{ color: "#1B5FA8" }}>{total}件</span>
      </div>
      <div className="space-y-1.5">
        {rows.map((r) => (
          <div key={r.id} className="flex items-center justify-between">
            <span className="font-body text-[12px]" style={{ color: r.color }}>{r.label}</span>
            <span className="font-mono text-[13px]" style={{ color: r.color }}>{r.n}件</span>
          </div>
        ))}
      </div>
      {(reviewCount + unnecessaryCount) > 0 && (
        <p className="font-body text-[11px] mt-2.5 leading-relaxed" style={{ color: "#444444" }}>
          　「見直す余地あり」「この事業は不要」と判定した{reviewCount + unnecessaryCount}件が、
          あなたが来年度の予算への申し送りとして提案できる中身です。金額の多寡より、
          この{reviewCount + unnecessaryCount}件それぞれに理由を持てているかが、決算を見直す上で重要です。
        </p>
      )}
      {holdCount > 0 && (
        <p className="font-body text-[11px] mt-1.5" style={{ color: "#767676" }}>
          　「判断できない」とした{holdCount}件は、情報が足りなかった項目です。
          事業内容や過去の質疑を読み直すと、判断材料が見つかるかもしれません。
        </p>
      )}
    </div>
  );
}

function Step5({ checklistCutByCategory, totalCut, goalOku, difficulty, flatCut, itemPercents, reasons, judgments, onNext }) {
  const achieved = totalCut >= goalOku;
  const ex = explainability(itemPercents, reasons);
  const exRate = ex.total > 0 ? Math.round((ex.explained / ex.total) * 100) : 0;
  // 削れる事業がある費目だけを評価対象にする
  const ratedCats = CATEGORIES.map((c) => ({
    c,
    r: cutRatioOf(c.id, difficulty.id, checklistCutByCategory),
  })).filter((x) => x.r !== null);
  const shownCount = CATEGORIES.reduce(
    (a, c) => a + visibleProjects(c.id, difficulty.id).length,
    0
  );
  const allVisible = shownCount >= 196;
  // 初級・中級では評価を出さず、自分がやったことの事実だけを並べる
  const touchedCats = ratedCats.filter(({ r }) => r > 0);
  const biggest = [...ex.detail].sort((a, b) => b.cutOku - a.cutOku)[0];
  const insights = [];
  if (ex.total > 0) {
    insights.push(
      `削ったのは${ex.total}項目、合わせて${yen(ex.okuTotal)}。1項目あたり平均${yen(
        ex.okuTotal / ex.total
      )}でした。事業は1件ずつだと、思ったより小さかったのではないでしょうか。`
    );
  }
  if (biggest) {
    insights.push(
      `いちばん大きく削ったのは、${biggest.projectName}の「${biggest.itemLabel}」で${yen(
        biggest.cutOku
      )}。これで困る人がいるとしたら、誰でしょうか。`
    );
  }
  insights.push(
    touchedCats.length > 0
      ? `手をつけたのは${touchedCats.map((x) => x.c.name).join("・")}の${
          touchedCats.length
        }費目。ほかの${ratedCats.length - touchedCats.length}費目には触れませんでした。それは選んだ結果でしたか、それとも開かなかっただけでしょうか。`
      : "今回はどの事業にも手をつけませんでした。開いてみると、動かせない項目がどれだけ多いかが分かります。"
  );
  return (
    <Card>
      <p className="font-body text-xs" style={{ color: "#1B5FA8" }}>STEP 5</p>
      <h2 className="font-display text-xl mt-1 mb-1">あなたの見直し提案</h2>
      <p className="font-body text-[13px] mt-1 mb-3" style={{ color: "#444444" }}>
        　「削れた金額」は、この提案の一部でしかありません。まずは、あなたが何件をどう判定したかです。
      </p>

      <JudgmentSummary judgments={judgments} />

      <details className="mb-4 rounded-sm" style={{ border: "1px solid #E2E5E9" }}>
        <summary
          className="font-body text-[12px] px-3 py-2 cursor-pointer"
          style={{ color: "#767676" }}
        >
          参考：試算した削減額を見る（ゲーム的な目安であり、主目的ではありません）
        </summary>
        <div className="px-3 pb-3">
          <p className="font-body text-[14px] mt-1">
            {difficulty.label}として、あなたは
            <span className="font-mono font-bold text-xl mx-1" style={{ color: achieved ? "#1B5FA8" : "#C0392B" }}>
              {yen(totalCut)}
            </span>
            {achieved ? "削減できました" : "しか削減できませんでした"}（目標 {yen(goalOku)}）。
          </p>
          <p className="font-body text-[12px] mt-1.5" style={{ color: "#444444" }}>
            {achieved
              ? "目標には届きましたが、それでも法律で額が決まっている支出（義務的経費）、人件費、施設の維持管理費、契約済みの事業には手を付けられませんでした。"
              : "理由は、法律で額が決まっている支出（義務的経費）、人件費、施設の維持管理費、そして契約済みの事業です。"}
          </p>
        </div>
      </details>

      {ex.total > 0 && (
        <div
          className="mb-4 rounded-sm px-3 py-3"
          style={{ background: "#FFFFFF", border: "1px solid #E2E5E9" }}
        >
          <div className="flex justify-between items-baseline">
            <span className="font-body text-[13px]">説明できる削減</span>
            <span className="font-mono text-lg font-bold" style={{ color: "#1B5FA8" }}>
              {ex.explained} / {ex.total}項目
            </span>
          </div>
          <div className="h-1.5 mt-1.5 rounded-sm overflow-hidden" style={{ background: "#EDEFF2" }}>
            <div style={{ width: `${exRate}%`, height: "100%", background: "#1B5FA8" }} />
          </div>
          <p className="font-body text-[11px] mt-2" style={{ color: "#444444" }}>
            削った{ex.total}項目のうち{ex.explained}項目は、
            市が見直すと書いていたか、議会で問われていたか、あなたが理由を選んだものです。
            金額は{yen(ex.okuExplained)}／{yen(ex.okuTotal)}。
          </p>
          {achieved && exRate < 50 && (
            <p className="font-body text-[12px] mt-2" style={{ color: "#992D22" }}>
              　金額は届きました。ただ、その半分以上について、なぜ削ったのかを説明する材料がありません。
              議会で同じことを聞かれたら、どう答えますか。
            </p>
          )}
          {exRate >= 80 && (
            <p className="font-body text-[12px] mt-2" style={{ color: "#1B5FA8" }}>
              　削ったほとんどについて、根拠を持っています。金額が届いたかどうかとは別に、
              これは説明できる予算案です。
            </p>
          )}
          <p className="font-body text-[10px] mt-2" style={{ color: "#767676" }}>
            ※ 点数ではありません。説明できない削減が悪いという意味でもなく、
            議会が実際に聞いているのが金額よりも「なぜ」だから並べています。
          </p>
        </div>
      )}

      {flatCut && (
        <div
          className="mb-4 rounded-sm px-3 py-3"
          style={{ background: "#F7ECEC", border: "1px solid #C0392B" }}
        >
          <p className="font-display text-[15px]" style={{ color: "#992D22" }}>
            あなた、ほんとにちゃんと選んだ？
          </p>
          <p className="font-body text-[12px] mt-1.5" style={{ color: "#444444" }}>
            　5つ以上の費目を、ほとんど同じ割合で削っています。数字は揃いますが、
            それは「どれを残すか」を決めなかった、ということでもあります。
          </p>
          <p className="font-body text-[12px] mt-1.5" style={{ color: "#444444" }}>
            　しかも同じ割合でも、重さは同じではありません。民生費は動かせるのが5%しかなく、
            商工費は35%あります。同じ「1割削減」でも、片方は余白を削り、
            片方は余白のないところに食い込みます。
          </p>
          <p className="font-body text-[12px] mt-1.5" style={{ color: "#992D22" }}>
            　戻ってやり直しても構いません。ここは、間違えても誰も困らない場所です。
          </p>
        </div>
      )}

      {allVisible ? (
        <>
          <h3 className="font-display text-[15px] mb-2">あなたが手をつけなかったもの</h3>
          <div className="space-y-2">
            {ratedCats.map(({ c, r }) => {
              const stars = Math.max(1, 5 - Math.round(r * 4));
              return (
                <div key={c.id} className="flex items-center justify-between">
                  <span className="font-body text-[13px]">
                    {c.name}
                    <span className="font-mono text-[10px] ml-1.5" style={{ color: "#767676" }}>
                      全{(PROJECT_POOL[c.id] || []).length}件
                    </span>
                  </span>
                  <span className="font-mono text-[13px]" style={{ color: "#1B7FA8" }}>
                    {"★".repeat(stars)}
                    <span style={{ color: "#E2E5E9" }}>{"★".repeat(5 - stars)}</span>
                  </span>
                </div>
              );
            })}
          </div>
          <p className="font-body text-[12px] mt-3" style={{ color: "#767676" }}>
            　★は、その費目でどれだけ手をつけなかったかを表します。★5は「一つも削らなかった」、★1は「削れるところをほぼ全部削った」。
            上級ではすべての事業が見えているので、これはあなたが全部を見た上で選んだ結果です。
            削る事業が無い費目（公債費・議会費など）は、そもそも選べないので載せていません。正解はありません。
          </p>
        </>
      ) : (
        <>
          <h3 className="font-display text-[15px] mb-2">気づいたことは、ありましたか</h3>
          <div className="space-y-2">
            {insights.map((t, i) => (
              <p
                key={i}
                className="font-body text-[13px] leading-relaxed rounded-sm px-3 py-2"
                style={{ background: "#FFFFFF", border: "1px solid #E2E5E9" }}
              >
                {t}
              </p>
            ))}
          </div>
          <p className="font-body text-[12px] mt-3" style={{ color: "#444444" }}>
            　今回あなたに見えていたのは、196事業のうち{shownCount}件でした。
            残りの{196 - shownCount}件のなかに、あなたなら削ると思うものはあるでしょうか。
            上級を選ぶと、全部が開きます。
          </p>
          <p className="font-body text-[10px] mt-2" style={{ color: "#767676" }}>
            ※ 一部の事業しか見ていない状態なので、費目ごとの評価は出していません。
            3件しか見ていない費目について「守った」とは言えないからです。
          </p>
        </>
      )}

      <NextButton onClick={onNext} />
    </Card>
  );
}

/* ---------------- STEP6：決算実績のランダム開示 ---------------- */

function KakomoView({ projectName }) {
  const [open, setOpen] = useState(false);
  const v = KAKOMO_VIEW[projectName];
  if (!v) return null;
  return (
    <div className="mt-2">
      <button
        onClick={() => setOpen(!open)}
        className="font-body text-[11px] w-full text-left rounded-sm px-2.5 py-1.5 flex items-center gap-2"
        style={{ background: "#EFF5FB", border: "1px dashed #1B7FA8", color: "#1B5FA8" }}
      >
        <img src={KAKOMO.think} alt="" style={{ width: 22, height: "auto" }} />
        {open ? "カコモの見方を閉じる" : "カコモはどう見たか"}
      </button>
      {open && (
        <div
          className="mt-1 rounded-sm px-3 py-2.5"
          style={{ background: "#EFF5FB", border: "1px dashed #1B7FA8" }}
        >
          <p className="font-mono text-[10px]" style={{ color: "#1B5FA8" }}>
            カコモの見方（ひとつの意見です。市や議会の判断ではありません）
          </p>
          <p className="font-body text-[12px] leading-relaxed mt-1" style={{ color: "#1A1A1A" }}>
            　{v.view}
          </p>
          <p className="font-body text-[12px] leading-relaxed mt-2" style={{ color: "#444444" }}>
            　<span className="font-medium" style={{ color: "#992D22" }}>でも、こうも言えます。</span>
            {v.but}
          </p>
          <p className="font-body text-[12px] mt-2 text-center" style={{ color: "#1B5FA8" }}>
            あなたは、どう思いますか。
          </p>
        </div>
      )}
    </div>
  );
}

                  style={{ background: "#EFF5FB", border: "1px dashed #1B7FA8" }}

                    　{v.view}
                  </p>
                  <p className="font-body text-[12px] leading-relaxed mt-2" style={{ color: "#444444" }}>
                    　<span className="font-medium" style={{ color: "#992D22" }}>でも、こうも言えます。</span>
                    {v.but}
                  </p>
                  <p className="font-body text-[11px] mt-2 text-center" style={{ color: "#1B5FA8" }}>

                  </p>
                </div>
              )}
            </div>

      </div>
    </div>

}

function GikaiSection({ chosenItems }) {
  // プレイヤーが実際に手をつけた事業のうち、議会でやり取りがあったものだけ
  const seen = new Set();
  const hits = [];
  for (const it of chosenItems) {
    if (seen.has(it.projectName)) continue;
    const entries = GIKAI_POOL[it.projectName];
    if (!entries) continue;
    seen.add(it.projectName);
    entries.forEach((e) => hits.push({ projectName: it.projectName, entry: e }));
  }
  if (hits.length === 0) return null;

  const unusedCount = hits.filter((h) =>
    ["unused", "unmeasured", "target"].includes(h.entry.type)
  ).length;
  const usedCommittees = Array.from(
    new Set(hits.map((h) => COMMITTEES[h.entry.com] && COMMITTEES[h.entry.com].name).filter(Boolean))
  );

  return (
    <div className="mt-5">
      <h3 className="font-display text-[15px] mb-1">議会では、こう議論されていました</h3>
      <p className="font-body text-[12px] mb-1" style={{ color: "#444444" }}>
        　あなたが手をつけた事業のうち{hits.length}件について、{usedCommittees.join("・")}
        （いずれも令和6年度決算審査）で実際にやり取りがありました。
      </p>
      {unusedCount > 0 && (
        <p className="font-body text-[12px] mb-2" style={{ color: "#C0392B" }}>
          　うち{unusedCount}件は、金額の多寡ではなく「必要な人に届いていない」
          「効果が確かめられていない」「目標が実態と合っていない」ことが指摘されていました。
          削るかどうかの前に、そもそも設計が問われている事業です。
        </p>
      )}
      <div className="space-y-3">
        {Array.from(new Set(hits.map((h) => h.projectName))).map((pname) => (
          <div key={pname}>
            <div className="space-y-2">
              {hits
                .filter((h) => h.projectName === pname)
                .map((h, i) => (
                  <GikaiRecord key={i} projectName={h.projectName} entry={h.entry} />
                ))}
            </div>
            <KakomoView projectName={pname} />
          </div>
        ))}
      </div>
      <p className="font-body text-[10px] mt-2" style={{ color: "#767676" }}>
        出典：加古川市議会 会議録。発言は要約しています。全文は市議会ホームページで公開されています。
      </p>
    </div>
  );
}

/* ---------------- STEP7：通信簿への導線 ---------------- */
function Step7({ checklistCutByCategory, itemPercents, reasons, difficulty }) {
  // 削れる事業がある費目だけを、実際に削った割合の小さい順に
  const ratedCats = CATEGORIES.map((c) => ({
    c,
    r: cutRatioOf(c.id, difficulty.id, checklistCutByCategory),
  })).filter((x) => x.r !== null);
  const topKept = [...ratedCats]
    .sort((a, b) => a.r - b.r)
    .slice(0, 2)
    .map((x) => x.c.name);

  // 実際に削減率を入れた項目（＝あなたが「削れる」と判断した実在事業の中身）
  const chosenItems = collectChosenItems(itemPercents);

  const touchedNames = Array.from(new Set(chosenItems.map((it) => it.projectName)));
  const questionedTouched = touchedNames.filter((n) => projectFlags(n).questioned).length;
  const selfReviewTouched = touchedNames.filter((n) => projectFlags(n).selfReview).length;
  const unknownCount = chosenItems.filter(
    (it) => reasons && reasons[it.key] === "unknown"
  ).length;

  return (
    <Card>
      <p className="font-body text-xs" style={{ color: "#1B5FA8" }}>最後に</p>
      <h2 className="font-display text-xl mt-1 mb-2">政治は、選ぶこと。</h2>
      <p className="font-body text-[15px] leading-relaxed">
        　あなたがいちばん手をつけなかったのは
        <span className="font-bold" style={{ color: "#C0392B" }}> {topKept.join("・")} </span>
        でした{difficulty.projectRatio < 1 || difficulty.projectCategories ? "（この難易度で見えていた事業の中での話です）" : ""}。
      </p>

      {chosenItems.length > 0 && (
        <>
          <p className="font-body text-[12px] mt-3" style={{ color: "#444444" }}>
            　あなたが手をつけた{touchedNames.length}事業のうち、議会でも効果や執行を問われていたのは
            <span className="font-mono font-bold" style={{ color: "#3E7CA6" }}> {questionedTouched}事業</span>、
            市自身が「見直す」と書いていたのは
            <span className="font-mono font-bold" style={{ color: "#1B7FA8" }}> {selfReviewTouched}事業</span>
            でした。印のない事業は、今回使った資料の範囲では議論が見当たらなかった、というだけです。
          </p>
          {unknownCount > 0 && (
            <p className="font-body text-[12px] mt-2" style={{ color: "#992D22" }}>
              　このうち{unknownCount}件は、あなた自身が「よく分からないまま削った」と答えています。
              その事業について、議会がどう聞いていたかを下に置きました。
            </p>
          )}
          <div className="mt-3 rounded-sm p-3" style={{ background: "#EDEFF2" }}>
            <p className="font-body text-[12px] mb-2" style={{ color: "#1B5FA8" }}>
              　あなたが手をつけた、実在事業の中身：
            </p>
            <ul className="space-y-2">
              {chosenItems.map((it) => (
                <li key={`${it.projectName}__${it.itemLabel}`} className="font-body text-[12px]">
                  <div className="flex justify-between gap-2">
                    <span>
                      {it.projectName}　<span style={{ color: "#767676" }}>／{it.itemLabel}</span>
                      <FlagBadges projectName={it.projectName} />
                    </span>
                    <span className="font-mono text-[11px] shrink-0" style={{ color: "#767676" }}>
                      {it.percent}%（{yen(it.cutOku)}）
                    </span>
                  </div>
                  {reasons && reasons[it.key] && (
                    <p className="text-[10px] mt-0.5" style={{ color: "#1B5FA8" }}>
                      あなたの理由：
                      {(CUT_REASONS.find((r) => r.id === reasons[it.key]) || {}).label}
                    </p>
                  )}
                  {it.consequence && (
                    <p className="text-[10px] mt-0.5" style={{ color: "#992D22" }}>
                      → {it.consequence}
                    </p>
                  )}
                </li>
              ))}
            </ul>
            <p className="font-body text-[10px] mt-2" style={{ color: "#767676" }}>
              印は「削ってよい」の意味でも「問題がない」の意味でもありません。市や議会が先に気づいていたことを、今回の資料で確認できた場所を示しているだけです。使ったのは決算審査の委員会3本と評価シートだけなので、印がない事業でも、本会議や他の場で議論されている可能性はあります。
            </p>
          </div>
        </>
      )}

      <GikaiSection chosenItems={chosenItems} />

      <ProposalSection chosenItems={chosenItems} />


      <p className="font-body text-sm mt-5 mb-5" style={{ color: "#444444" }}>
        　ここに出てくるのは3つの常任委員会の記録で、質問した議員と、しなかった議員がいます。
        4年分の記録は「議員通信簿」で確かめられます。
      </p>
      <a
        href="https://kakogawa-giin-map.com"
        target="_blank"
        rel="noopener noreferrer"
        className="font-body block text-center w-full py-3 rounded-sm font-medium"
        style={{ background: "#1B5FA8", color: "#FFFFFF" }}
      >
        議員通信簿を見る →
      </a>
      <a
        href="https://chinjouojisan.github.io/kakogawagikaimap01/"
        target="_blank"
        rel="noopener noreferrer"
        className="font-body block text-center w-full py-3 mt-2 rounded-sm text-[14px] border"
        style={{ borderColor: "#1B5FA8", color: "#1B5FA8", background: "#FFFFFF" }}
      >
        加古川市議会マップ（まとめサイト）で他のサイトも見る
      </a>
      <SourceNote />
    </Card>
  );
}
